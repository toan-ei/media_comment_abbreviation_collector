spring:
  application:
    name: social-comment-abbreviation-collector

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/social_comment_collector?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: 8080

youtube:
  api:
    base-url: https://www.googleapis.com/youtube/v3
    key: ${YOUTUBE_API_KEY}

management:
    endpoints:
      web:
        exposure:
          include: health

crawler:
  worker:
    enabled: true
    delay-ms: 2000

  recovery:
    delay-ms: 60000
    processing-timeout-minutes: 30
